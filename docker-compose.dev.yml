services:

  # ── Shared Postgres ────────────────────────────────────────────────────────
  # One instance serves two databases:
  #   orthanc       — Orthanc index (metadata, fast queries via PG plugin)
  #   dicom_emulator — Azure DICOM Service Emulator state
  #
  # WARNING: dev credentials only — never use these in production.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: orthanc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d orthanc"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Orthanc ────────────────────────────────────────────────────────────────
  # latest-full ships all plugins in plugins-available/ but only activates a
  # small default set in plugins/. We explicitly add the viewer .so paths so
  # Stone, OHIF, VolView, and Authorization are loaded without pulling in every
  # other plugin (Azure Blob, MySQL, ODBC, etc.).
  # Index lives in Postgres; DICOM file blobs stay on a local volume.
  orthanc:
    image: orthancteam/orthanc:latest-full
    restart: unless-stopped
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC__NAME: "OE3 Dev"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__DICOM_MODALITIES_IN_DATABASE: "true"
      ORTHANC__ORTHANC_PEERS_IN_DATABASE: "true"
      ORTHANC__HTTP_HEADERS: '{"Access-Control-Allow-Origin":"*","Access-Control-Allow-Methods":"GET,POST,PUT,DELETE,OPTIONS","Access-Control-Allow-Headers":"Content-Type,Authorization,X-Request-Id"}'
      ORTHANC__HTTP_TIMEOUT: "300"
      ORTHANC__HTTP_REQUEST_TIMEOUT: "300"
      ORTHANC__NETWORK_TIMEOUT: "300"
      ORTHANC__DICOM_SCU_TIMEOUT: "300"
      ORTHANC__DICOM_SCP_TIMEOUT: "300"
      ORTHANC__LOG_EXPORTED_RESOURCES: "true"

      # ── Plugins: active dir + individual viewer .so files ──
      # ── PostgreSQL index ──
      ORTHANC__POSTGRESQL__HOST: "postgres"
      ORTHANC__POSTGRESQL__PORT: "5432"
      ORTHANC__POSTGRESQL__DATABASE: "orthanc"
      ORTHANC__POSTGRESQL__USERNAME: "dev"
      ORTHANC__POSTGRESQL__PASSWORD: "dev"
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__POSTGRESQL__MAXIMUM_CONNECTION_RETRIES: "10"
      ORTHANC__POSTGRESQL__CONNECTION_RETRY_INTERVAL: "5"

      # ── DICOMweb ──
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__ENABLE_WADO: "true"
      ORTHANC__DICOM_WEB__ENABLE_STOW: "true"
      ORTHANC__DICOM_WEB__ENABLE_QIDO: "true"
      ORTHANC__DICOM_WEB__CHUNKED_TRANSFERS: "true"
      ORTHANC__DICOM_WEB__TIMEOUT: "300"
      # Azure emulator DICOMweb server (for authMode: "oidc" dev testing)
      ORTHANC__DICOM_WEB__SERVERS: >-
        {"azure-emulator":{"Url":"http://azure-emulator:8080/v2","HasDelete":true,"ChunkedTransfers":true}}

      # ── Orthanc Explorer 2 ──
      ORTHANC__ORTHANC_EXPLORER_2__IS_DEFAULT_ORTHANC_UI: "true"
      ORTHANC__ORTHANC_EXPLORER_2__ENABLE: "true"

      # ── Stone Web Viewer ──
      # STONE_WEB_VIEWER_PLUGIN_ENABLED is the non-standard env var that triggers
      # the entrypoint to copy libStoneWebViewer.so into plugins/ on startup.
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "true"
      ORTHANC__STONE_WEB_VIEWER__STUDY_DOWNLOAD_ENABLED: "true"

      # ── OHIF Viewer ──
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC__OHIF__ROUTER_BASENAME: "/ohif/"
      ORTHANC__OHIF__ENABLE_SHARED_ARRAY_BUFFER: "true"
      ORTHANC__OHIF__STUDY_LIST_FUNCTIONALITY: "true"

      # ── VolView ──
      VOLVIEW_PLUGIN_ENABLED: "true"
      ORTHANC__VOL_VIEW__VOLUME_RENDERING_ENABLED: "true"
      ORTHANC__VOL_VIEW__MULTI_PLANAR_RECONSTRUCTION_ENABLED: "true"

    volumes:
      - orthanc-data:/var/lib/orthanc/db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/system > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ── Azure DICOM Service Emulator ───────────────────────────────────────────
  # Stand-in for Azure Health Data Services DICOM API.
  # Uses the shared postgres service (dicom_emulator database).
  azure-emulator:
    image: rhavekost/azure-dicom-service-emulator:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql+asyncpg://dev:dev@postgres:5432/dicom_emulator"
      DICOM_STORAGE_DIR: /data/dicom
      EXPIRY_INTERVAL_SECONDS: 3600
    volumes:
      - dicom-data:/data/dicom
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── OAuth DICOMweb Plugin ──────────────────────────────────────────────────
  # Proxies DICOMweb requests to azure-emulator with OAuth token injection.
  # Only needed for authMode: "oidc" / "smart" testing — NOT for authMode: "none".
  #
  # Start with: docker compose -f docker-compose.dev.yml --profile oauth up -d
  #
  # TODO: the plugin's bundled orthanc.json has an example-server with empty
  # ClientId that fails schema validation on startup. Before enabling, either:
  #   - mount an override orthanc.json with a real ClientId (even a placeholder)
  #   - or set the correct env var when the plugin supports ORTHANC__ overrides
  #
  # Runs as linux/amd64 under Rosetta (no arm64 image available yet).
  oauth-plugin:
    image: rhavekost/orthanc-dicomweb-oauth:latest
    platform: linux/amd64
    profiles: ["oauth"]
    environment:
      DICOMWEB_TARGET_URL: "http://azure-emulator:8080/v2"
      OAUTH_TOKEN_ENDPOINT: "http://azure-emulator:8080/oauth/token"
      OAUTH_MODE: "dev"
    depends_on:
      azure-emulator:
        condition: service_healthy

  # ── DICOM Peer (test modality) ────────────────────────────────────────────
  # A second Orthanc instance using SQLite (no Postgres dependency).
  # Acts as a real DICOM peer for C-ECHO, C-STORE, and C-MOVE testing.
  #
  # Inside the compose network: hostname "dicom-peer", DICOM port 4242.
  # From the host: HTTP on 8043, DICOM on 4243.
  #
  # The primary Orthanc resolves "dicom-peer" via Docker DNS when executing
  # C-ECHO — the browser never needs to resolve this hostname.
  dicom-peer:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    ports:
      - "8043:8042"
      - "4243:4242"
    environment:
      ORTHANC__NAME: "OE3 Dev Peer"
      ORTHANC__DICOM_AET: "PEER"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      ORTHANC__HTTP_HEADERS: '{"Access-Control-Allow-Origin":"*"}'
      ORTHANC__HTTP_TIMEOUT: "30"
      ORTHANC__DICOM_SCU_TIMEOUT: "30"
      ORTHANC__DICOM_SCP_TIMEOUT: "30"
    volumes:
      - peer-data:/var/lib/orthanc/db
    healthcheck:
      # orthanc:latest (slim) has no curl/wget — use python3 (always present)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8042/system')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Test data seeder ───────────────────────────────────────────────────────
  # Optional profile — loads test-data/sample.dcm into Orthanc.
  # Run: docker compose -f docker-compose.dev.yml --profile seed up seeder
  seeder:
    image: curlimages/curl:latest
    profiles: ["seed"]
    depends_on:
      orthanc:
        condition: service_healthy
    command: ["sh", "-c", "curl -sf -X POST http://orthanc:8042/instances --data-binary @/seed/sample.dcm -H 'Content-Type: application/dicom' && echo 'Seed complete' || (echo 'Seed FAILED' && exit 1)"]
    volumes:
      - ./test-data:/seed:ro

  # ── Modality seeder ────────────────────────────────────────────────────────
  # Idempotently registers the PEER modality in the primary Orthanc DB on every
  # `docker compose up`.  Runs after orthanc is healthy so PUT always succeeds.
  #
  # Why not use ORTHANC__DICOM_MODALITIES env var?
  # With DICOM_MODALITIES_IN_DATABASE=true, Orthanc only imports static modality
  # config on the very first run (empty DB).  This seeder approach works for
  # both fresh and existing pgdata volumes because PUT /modalities is idempotent.
  modality-seeder:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      orthanc:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        curl -sf -X PUT http://orthanc:8042/modalities/PEER \
          -H "Content-Type: application/json" \
          -d '{"AET":"PEER","Host":"dicom-peer","Port":4242}' && \
        echo "PEER modality registered"

volumes:
  pgdata:
  orthanc-data:
  dicom-data:
  peer-data:
